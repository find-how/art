<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Pioneer Application code to Cloudflare shape</title>
  <desc id="desc">Route, database, cache, queue, auth, and deploy from the code you already wrote.</desc>
  
  <defs>
    <linearGradient id="linkedin-edge-framework-svg-bg" x1="0" y1="0" x2="1200" y2="627" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F7EF"/>
      <stop offset=".58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2E4"/>
    </linearGradient>
    <radialGradient id="linkedin-edge-framework-svg-glow-a" cx="22%" cy="18%" r="55%">
      <stop offset="0" stop-color="#A5DBB7" stop-opacity=".34"/>
      <stop offset="1" stop-color="#A5DBB7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="linkedin-edge-framework-svg-glow-b" cx="86%" cy="86%" r="48%">
      <stop offset="0" stop-color="#D9A441" stop-opacity=".20"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <pattern id="linkedin-edge-framework-svg-grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="rgba(22,26,23,.055)" stroke-width="1"/>
    </pattern>
    <filter id="linkedin-edge-framework-svg-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0A0A0A" flood-opacity=".20"/>
    </filter>
  </defs>
  <rect width="1200" height="627" fill="url(#linkedin-edge-framework-svg-bg)"/>
  <rect width="1200" height="627" fill="url(#linkedin-edge-framework-svg-glow-a)"/>
  <rect width="1200" height="627" fill="url(#linkedin-edge-framework-svg-glow-b)"/>
  <rect width="1200" height="627" fill="url(#linkedin-edge-framework-svg-grid)"/>
  
  <g transform="translate(940 377) scale(0.42)">
    <defs>
      <linearGradient id="linkedin-edge-framework-svg-bird-g" x1="8" y1="17" x2="500" y2="493" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2D7A3E"/>
        <stop offset=".52" stop-color="#4A9D5F"/>
        <stop offset="1" stop-color="#7CB342"/>
      </linearGradient>
      <linearGradient id="linkedin-edge-framework-svg-bird-w" x1="230" y1="50" x2="500" y2="170" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#4A9D5F"/>
        <stop offset="1" stop-color="#B8EA4F"/>
      </linearGradient>
    </defs>
    <path fill="url(#linkedin-edge-framework-svg-bird-g)" d="M8 110 46 73 46 110Z"/>
    <path fill="url(#linkedin-edge-framework-svg-bird-g)" d="M56 66H96L170 153 133 190H56Z"/>
    <path fill="url(#linkedin-edge-framework-svg-bird-g)" d="M150 190 305 26 305 190Z"/>
    <path fill="url(#linkedin-edge-framework-svg-bird-w)" d="M317 17 486 23 317 177Z"/>
    <path fill="url(#linkedin-edge-framework-svg-bird-w)" d="M421 99 500 55 474 46Z"/>
    <path fill="url(#linkedin-edge-framework-svg-bird-g)" d="M64 202H303L237 383Z"/>
    <path fill="url(#linkedin-edge-framework-svg-bird-g)" d="M307 229 306 493 227 440Z"/>
  </g>
  <rect x="66" y="53" width="1068" height="520" rx="28" fill="rgba(255,255,255,.66)" stroke="rgba(22,26,23,.10)"/>
  <text x="108" y="107" fill="#2D7A3E" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="0">Edge-native framework</text>
  <text x="108" y="194" fill="#161A17" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="0">Application code</text>
<text x="108" y="250.84" fill="#161A17" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="0">to Cloudflare shape</text>
  <text x="108" y="433" fill="#4B554C" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="26" font-weight="650">Route, database, cache, queue, auth, and deploy from the code you already wrote.</text>
  
  <g filter="url(#linkedin-edge-framework-svg-shadow)">
    <clipPath id="linkedin-edge-framework-svg-codeclip">
      <rect x="720" y="144" width="384" height="248" rx="18"/>
    </clipPath>
    <rect x="720" y="144" width="384" height="248" rx="18" fill="#0A0A0A" stroke="#262626"/>
    <rect x="720" y="144" width="384" height="48" rx="18" fill="#171717"/>
    <circle cx="746" cy="168" r="6" fill="#EF4444"/>
    <circle cx="768" cy="168" r="6" fill="#F59E0B"/>
    <circle cx="790" cy="168" r="6" fill="#22C55E"/>
    <text x="816" y="175" fill="#A5DBB7" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">app/routes/web.ts</text>
    <g clip-path="url(#linkedin-edge-framework-svg-codeclip)">
      
      <rect x="740" y="194" width="314" height="28" rx="6" fill="#7DD3FC" opacity=".09"/>
      <text x="750" y="216" fill="#7DD3FC" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">Route.post('/checkout', async ({ request, DB, Queue, Cache }) =&gt; {</text>
      <rect x="740" y="223" width="264" height="28" rx="6" fill="#86EFAC" opacity=".09"/>
      <text x="750" y="245" fill="#86EFAC" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">  const order = await DB.table('orders').create(await request.json())</text>
      <rect x="740" y="252" width="264" height="28" rx="6" fill="#FACC15" opacity=".09"/>
      <text x="750" y="274" fill="#FACC15" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">  Cache.set(`order:${order.id}`, order, { ttl: 60 * 15 })</text>
      <rect x="740" y="281" width="264" height="28" rx="6" fill="#38BDF8" opacity=".09"/>
      <text x="750" y="303" fill="#38BDF8" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">  await Queue.dispatch('send-receipt', { orderId: order.id })</text>
      <rect x="740" y="310" width="264" height="28" rx="6" fill="#FB923C" opacity=".09"/>
      <text x="750" y="332" fill="#FB923C" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">  return Response.json(order, { status: 201 })</text>
      <rect x="740" y="339" width="264" height="28" rx="6" fill="#A5DBB7" opacity=".09"/>
      <text x="750" y="361" fill="#A5DBB7" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">}).middleware(['auth', 'verified'])</text>
    </g>
  </g>
  <text x="108" y="527" fill="#161A17" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">find.how/pioneer</text>
</svg>
