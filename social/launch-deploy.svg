<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pioneer Deploy to Pioneer with local proof</title>
  <desc id="desc">Generated Worker, bound services, migrations, and smoke test before remote release.</desc>
  
  <defs>
    <linearGradient id="launch-deploy-svg-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset=".58" stop-color="#101A13"/>
      <stop offset="1" stop-color="#183522"/>
    </linearGradient>
    <radialGradient id="launch-deploy-svg-glow-a" cx="22%" cy="18%" r="55%">
      <stop offset="0" stop-color="#A5DBB7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#A5DBB7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="launch-deploy-svg-glow-b" cx="86%" cy="86%" r="48%">
      <stop offset="0" stop-color="#D9A441" stop-opacity=".22"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <pattern id="launch-deploy-svg-grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="rgba(255,255,255,.055)" stroke-width="1"/>
    </pattern>
    <filter id="launch-deploy-svg-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0A0A0A" flood-opacity=".46"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#launch-deploy-svg-bg)"/>
  <rect width="1200" height="630" fill="url(#launch-deploy-svg-glow-a)"/>
  <rect width="1200" height="630" fill="url(#launch-deploy-svg-glow-b)"/>
  <rect width="1200" height="630" fill="url(#launch-deploy-svg-grid)"/>
  
  <g transform="translate(940 380) scale(0.42)">
    <defs>
      <linearGradient id="launch-deploy-svg-bird-g" x1="8" y1="17" x2="500" y2="493" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2D7A3E"/>
        <stop offset=".52" stop-color="#4A9D5F"/>
        <stop offset="1" stop-color="#7CB342"/>
      </linearGradient>
      <linearGradient id="launch-deploy-svg-bird-w" x1="230" y1="50" x2="500" y2="170" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#4A9D5F"/>
        <stop offset="1" stop-color="#B8EA4F"/>
      </linearGradient>
    </defs>
    <path fill="url(#launch-deploy-svg-bird-g)" d="M8 110 46 73 46 110Z"/>
    <path fill="url(#launch-deploy-svg-bird-g)" d="M56 66H96L170 153 133 190H56Z"/>
    <path fill="url(#launch-deploy-svg-bird-g)" d="M150 190 305 26 305 190Z"/>
    <path fill="url(#launch-deploy-svg-bird-w)" d="M317 17 486 23 317 177Z"/>
    <path fill="url(#launch-deploy-svg-bird-w)" d="M421 99 500 55 474 46Z"/>
    <path fill="url(#launch-deploy-svg-bird-g)" d="M64 202H303L237 383Z"/>
    <path fill="url(#launch-deploy-svg-bird-g)" d="M307 229 306 493 227 440Z"/>
  </g>
  <rect x="66" y="54" width="1068" height="523" rx="28" fill="rgba(10,10,10,.44)" stroke="rgba(255,255,255,.12)"/>
  <text x="108" y="107" fill="#A5DBB7" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="0">One-click deploy</text>
  <text x="108" y="195" fill="#FFFFFF" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="0">Deploy to Pioneer</text>
<text x="108" y="251.84" fill="#FFFFFF" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="0">with local proof</text>
  <text x="108" y="435" fill="#B7C8B7" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="26" font-weight="650">Generated Worker, bound services, migrations, and smoke test before remote release.</text>
  
  <g filter="url(#launch-deploy-svg-shadow)">
    <clipPath id="launch-deploy-svg-termclip">
      <rect x="720" y="145" width="384" height="300" rx="18"/>
    </clipPath>
    <rect x="720" y="145" width="384" height="300" rx="18" fill="#070707" stroke="#262626"/>
    <rect x="720" y="145" width="384" height="50" rx="18" fill="#171717"/>
    <circle cx="746" cy="170" r="6" fill="#EF4444"/>
    <circle cx="768" cy="170" r="6" fill="#F59E0B"/>
    <circle cx="790" cy="170" r="6" fill="#22C55E"/>
    <text x="816" y="177" fill="#A3A3A3" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">pioneer deploy --local</text>
    <g clip-path="url(#launch-deploy-svg-termclip)">
      <text x="748" y="233" fill="#86EFAC" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">$ pioneer deploy app/routes/web.ts --local</text>
<text x="748" y="267" fill="#D4D4D4" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">Analyzing Route.post('/checkout')</text>
<text x="748" y="301" fill="#7DD3FC" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">Inferred services: Worker, D1, Cache, Queue, Auth</text>
<text x="748" y="335" fill="#86EFAC" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">D1 migrations applied locally: checkout-db</text>
<text x="748" y="369" fill="#86EFAC" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">Ready on http://127.0.0.1:8789</text>
<text x="748" y="403" fill="#7DD3FC" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">HTTP/1.1 201 Created</text>
    </g>
  </g>
  <text x="108" y="529" fill="#DCE5D7" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">find.how/pioneer</text>
