<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pioneer signal loading mark</title>
  <desc id="desc">Animated Pioneer bird mark with rotating tactical signal rings.</desc>
  <defs>
    <linearGradient id="pioneerGradient" x1="56" y1="68" x2="456" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#176f38"/>
      <stop offset="0.52" stop-color="#4a9d5f"/>
      <stop offset="1" stop-color="#9fcd48"/>
    </linearGradient>
    <linearGradient id="wingGradient" x1="230" y1="70" x2="438" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fb55d"/>
      <stop offset="1" stop-color="#d5ff5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#07140d" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7cb342" flood-opacity="0.28"/>
    </filter>
    <style>
      .ring {
        fill: none;
        stroke-linecap: round;
        transform-origin: 256px 256px;
      }

      .ring.outer {
        stroke: #2d7a3e;
        stroke-dasharray: 82 214;
        stroke-width: 6;
        opacity: .46;
        animation: rotate 1700ms linear infinite;
      }

      .ring.inner {
        stroke: #d9a441;
        stroke-dasharray: 36 150;
        stroke-width: 4;
        opacity: .68;
        animation: rotate-reverse 1250ms linear infinite;
      }

      .bird {
        filter: url(#shadow);
        transform-origin: 256px 256px;
        animation: lock 1500ms cubic-bezier(.45, 0, .18, 1) infinite;
      }

      .right-wing {
        transform-origin: 313px 183px;
        animation: wing-check 1500ms cubic-bezier(.45, 0, .18, 1) infinite;
      }

      .dot {
        fill: #d9a441;
        opacity: 0;
        animation: ping 1500ms ease-out infinite;
      }

      .dot.two {
        animation-delay: 220ms;
      }

      .dot.three {
        animation-delay: 430ms;
      }

      @keyframes rotate {
        to { transform: rotate(360deg); }
      }

      @keyframes rotate-reverse {
        to { transform: rotate(-360deg); }
      }

      @keyframes lock {
        0%, 100% { transform: scale(1); }
        48% { transform: scale(1.028); }
        68% { transform: scale(.992); }
      }

      @keyframes wing-check {
        0%, 100% { transform: rotate(0deg); }
        44% { transform: rotate(-5deg); }
        62% { transform: rotate(2deg); }
      }

      @keyframes ping {
        0% { opacity: 0; transform: scale(.5); }
        38% { opacity: .9; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.8); }
      }

      @media (prefers-reduced-motion: reduce) {
        .ring,
        .bird,
        .right-wing,
        .dot {
          animation: none;
        }

        .dot {
          opacity: .72;
        }
      }
    </style>
  </defs>

  <circle class="ring outer" cx="256" cy="256" r="214"/>
  <circle class="ring inner" cx="256" cy="256" r="176"/>
  <circle class="dot" cx="118" cy="166" r="5"/>
  <circle class="dot two" cx="396" cy="132" r="4"/>
  <circle class="dot three" cx="413" cy="344" r="5"/>

  <g class="bird" transform="translate(69 61) scale(.74)">
    <path fill="url(#pioneerGradient)" d="M8 110 46 73 46 110Z"/>
    <path fill="url(#pioneerGradient)" d="M56 66H96L170 153 133 190H56Z"/>
    <path fill="url(#pioneerGradient)" d="M150 190 305 26 305 190Z"/>
    <g class="right-wing">
      <path fill="url(#wingGradient)" d="M317 17 486 23 317 177Z"/>
      <path fill="url(#wingGradient)" d="M421 99 500 55 474 46Z"/>
    </g>
    <path fill="url(#pioneerGradient)" d="M64 202H303L237 383Z"/>
    <path fill="url(#pioneerGradient)" d="M307 229 306 493 227 440Z"/>
  </g>
</svg>
