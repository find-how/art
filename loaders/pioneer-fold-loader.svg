<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pioneer fold loading mark</title>
  <desc id="desc">Animated Pioneer bird mark with sequential origami fold illumination.</desc>
  <defs>
    <linearGradient id="pioneerGradient" x1="8" y1="17" x2="500" y2="493" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d6a32"/>
      <stop offset="0.5" stop-color="#3d9945"/>
      <stop offset="1" stop-color="#a5d64a"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d9a441" stop-opacity=".82"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0a170e" flood-opacity="0.34"/>
    </filter>
    <style>
      .bird {
        filter: url(#shadow);
      }

      .fold {
        fill: url(#pioneerGradient);
        animation: fold 1440ms cubic-bezier(.45, 0, .18, 1) infinite;
      }

      .fold.two { animation-delay: 90ms; }
      .fold.three { animation-delay: 180ms; }
      .fold.four { animation-delay: 270ms; }
      .fold.five { animation-delay: 360ms; }
      .fold.six { animation-delay: 450ms; }
      .fold.seven { animation-delay: 540ms; }

      .blade {
        opacity: 0;
        transform-origin: 256px 256px;
        animation: blade 1440ms ease-in-out infinite;
      }

      .under {
        fill: none;
        stroke: #456275;
        stroke-linecap: round;
        stroke-width: 5;
        opacity: .36;
        stroke-dasharray: 22 18;
        animation: dash 1440ms linear infinite;
      }

      @keyframes fold {
        0%, 100% { filter: brightness(1) saturate(1); transform: translateY(0); }
        42% { filter: brightness(1.32) saturate(1.18); transform: translateY(-4px); }
        72% { filter: brightness(.96) saturate(1); transform: translateY(0); }
      }

      @keyframes blade {
        0%, 18% { opacity: 0; transform: translateX(-190px) rotate(-7deg); }
        42% { opacity: .9; }
        72%, 100% { opacity: 0; transform: translateX(190px) rotate(-7deg); }
      }

      @keyframes dash {
        to { stroke-dashoffset: -80; }
      }

      @media (prefers-reduced-motion: reduce) {
        .fold,
        .blade,
        .under {
          animation: none;
        }

        .blade {
          opacity: .2;
        }
      }
    </style>
  </defs>

  <path class="under" d="M82 422 C162 452 310 456 425 402"/>
  <g class="bird" transform="translate(4 2)">
    <path class="fold one" d="M8 110 46 73 46 110Z"/>
    <path class="fold two" d="M56 66H96L170 153 133 190H56Z"/>
    <path class="fold three" d="M150 190 305 26 305 190Z"/>
    <path class="fold four" d="M317 17 486 23 317 177Z"/>
    <path class="fold five" d="M421 99 500 55 474 46Z"/>
    <path class="fold six" d="M64 202H303L237 383Z"/>
    <path class="fold seven" d="M307 229 306 493 227 440Z"/>
  </g>
  <rect class="blade" x="92" y="232" width="330" height="14" rx="7" fill="url(#flare)"/>
</svg>
