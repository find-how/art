<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pioneer demo thumbnail</title>
  <desc id="desc">Demo thumbnail with the message AI wrote the endpoint. Pioneer ran the app.</desc>
  <rect width="1280" height="720" fill="#f4f7ef"/>
  <rect x="70" y="70" width="1140" height="580" rx="20" fill="#ffffff" stroke="#dce5d7"/>
  <rect x="642" y="70" width="568" height="580" rx="20" fill="#161a17"/>
  <text x="120" y="178" fill="#2d7a3e" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="800">PIONEER DEMO</text>
  <text x="120" y="282" fill="#161a17" font-family="Instrument Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="74" font-weight="840">AI wrote</text>
  <text x="120" y="366" fill="#161a17" font-family="Instrument Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="74" font-weight="840">the endpoint.</text>
  <text x="120" y="472" fill="#2d7a3e" font-family="Instrument Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="820">Pioneer ran the app.</text>
