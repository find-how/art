  <rect x="692" y="402" width="428" height="72" rx="10" fill="#202020" stroke="#262626"/>
  <text x="720" y="447" fill="#e5e5e5" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="18">Queue send-receipt dispatched</text>
  <rect x="692" y="518" width="260" height="58" rx="9" fill="#2d7a3e"/>
  <text x="724" y="554" fill="#ffffff" font-family="Instrument Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">Deploy to Pioneer</text>
