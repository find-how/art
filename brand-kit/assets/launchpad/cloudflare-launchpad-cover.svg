<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Workers Launchpad cover</title>
  <desc id="desc">Pioneer launchpad visual for Cloudflare Workers.</desc>
  <rect width="1600" height="900" fill="#f4f7ef"/>
  <rect x="90" y="90" width="1420" height="720" rx="24" fill="#161a17"/>
  <text x="160" y="214" fill="#d9a441" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="800">CLOUDFLARE WORKERS LAUNCHPAD</text>
  <text x="160" y="342" fill="#ffffff" font-family="Instrument Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="88" font-weight="840">Pioneer turns business logic</text>
  <text x="160" y="444" fill="#cfe7b7" font-family="Instrument Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="88" font-weight="840">into running edge apps.</text>
  <rect x="160" y="552" width="250" height="68" rx="10" fill="#2d7a3e"/>
  <text x="194" y="595" fill="#ffffff" font-family="Instrument Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">Deploy to Pioneer</text>
  <text x="160" y="704" fill="#e5e5e5" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="24">Worker + D1 + Cache + Queue + Logs</text>
</svg>
