<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Pioneer deploy button artwork</title>
  <desc id="desc">Dark green Deploy to Pioneer button with the Pioneer bird mark and a diagonal shine treatment.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111713"/>
      <stop offset="0.55" stop-color="#1b3f28"/>
      <stop offset="1" stop-color="#2d7a3e"/>
    </linearGradient>
    <radialGradient id="sprout" cx="16%" cy="0%" r="48%">
      <stop offset="0" stop-color="#7cb342" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#7cb342" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="88%" cy="100%" r="46%">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <path d="M0 0H1V16H0Z" fill="#ffffff" opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0a0a0a" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7cb342" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="0" fill="#f4f7ef"/>
  <rect x="60" y="60" width="1080" height="400" rx="16" fill="#161a17"/>
  <rect x="60" y="60" width="1080" height="400" rx="16" fill="url(#sprout)"/>
  <rect x="60" y="60" width="1080" height="400" rx="16" fill="url(#gold)"/>
  <path d="M100 126H1100" stroke="#f4f7ef" stroke-opacity="0.08"/>
  <path d="M100 394H1100" stroke="#f4f7ef" stroke-opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="360" y="196" width="480" height="128" rx="22" fill="url(#page)" stroke="#7cb342" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="360" y="196" width="480" height="128" rx="22" fill="url(#hatch)"/>
    <path d="M322 180L650 180L520 340L192 340Z" fill="url(#shine)" opacity="0.78"/>
    <rect x="386" y="222" width="76" height="76" rx="16" fill="#f4f7ef" stroke="#ffffff" stroke-opacity="0.72"/>
    <image href="data:image/png;base64," x="403" y="239" width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
    <text x="488" y="256" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Deploy to Pioneer</text>
    <text x="489" y="287" fill="#f4f7ef" fill-opacity="0.78" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.2">WRANGLER LOCAL FEEDBACK</text>
  </g>

  <text x="600" y="126" text-anchor="middle" fill="#cfe7b7" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">BUTTON ASSET</text>
  <text x="600" y="382" text-anchor="middle" fill="#f4f7ef" fill-opacity="0.76" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Dark primary treatment from the Demo Wrangler app</text>
</svg>
