<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Pioneer deploy strip artwork</title>
  <desc id="desc">Wide Pioneer deploy strip with launch copy and a light deploy link button.</desc>
  <defs>
    <linearGradient id="strip" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#161a17"/>
      <stop offset="0.52" stop-color="#1b3f28"/>
      <stop offset="1" stop-color="#2d7a3e"/>
    </linearGradient>
    <radialGradient id="sprout" cx="16%" cy="0%" r="42%">
      <stop offset="0" stop-color="#7cb342" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cb342" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="78%" cy="100%" r="42%">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <path d="M0 0H1V18H0Z" fill="#ffffff" opacity="0.052"/>
    </pattern>
    <filter id="buttonShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0a0a0a" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7cb342" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1400" height="420" fill="#f4f7ef"/>
  <rect x="70" y="80" width="1260" height="260" rx="18" fill="url(#strip)"/>
  <rect x="70" y="80" width="1260" height="260" rx="18" fill="url(#sprout)"/>
  <rect x="70" y="80" width="1260" height="260" rx="18" fill="url(#gold)"/>
  <rect x="70" y="80" width="1260" height="260" rx="18" fill="url(#hatch)"/>
  <path d="M70 80H1330V340H70Z" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <path d="M120 130H1280" stroke="#ffffff" stroke-opacity="0.08"/>
  <path d="M120 290H1280" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="138" y="172" fill="#cfe7b7" font-family="SFMono-Regular, Consolas, monospace" font-size="17" font-weight="800" letter-spacing="2">LAUNCH WITH PIONEER</text>
  <text x="138" y="230" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="850">Run generated apps through Pioneer.</text>
  <text x="140" y="267" fill="#f4f7ef" fill-opacity="0.72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">Reusable strip treatment for demos, docs, and generated app previews.</text>

  <g filter="url(#buttonShadow)">
    <rect x="972" y="171" width="266" height="88" rx="16" fill="#f4f7ef" stroke="#ffffff" stroke-opacity="0.66"/>
    <rect x="972" y="171" width="266" height="88" rx="16" fill="#ffffff" opacity="0.12"/>
    <image href="data:image/png;base64," x="1000" y="195" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
    <text x="1058" y="208" fill="#161a17" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="820">Deploy to Pioneer</text>
    <text x="1059" y="234" fill="#2d7a3e" font-family="SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800" letter-spacing="1">LOCAL WRANGLER RUN</text>
  </g>
</svg>
