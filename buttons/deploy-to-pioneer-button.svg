<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Deploy to Pioneer button</title>
  <desc id="desc">Light Deploy to Pioneer button with the Pioneer bird mark.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0a0a0a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7cb342" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="button" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f7ef"/>
    </linearGradient>
  </defs>
  <rect width="760" height="220" fill="#f4f7ef"/>
  <g filter="url(#shadow)">
    <rect x="190" y="65" width="380" height="90" rx="18" fill="url(#button)" stroke="#dce5d7" stroke-width="2"/>
    <rect x="190" y="65" width="380" height="90" rx="18" fill="#ffffff" opacity="0.22"/>
    <image href="data:image/png;base64," x="224" y="88" width="44" height="44" preserveAspectRatio="xMidYMid meet"/>
    <text x="292" y="105" fill="#161a17" font-family="Instrument Sans, Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Deploy to Pioneer</text>
    <text x="294" y="132" fill="#2d7a3e" font-family="Commit Mono, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800" letter-spacing="1.2">EDGE FEEDBACK LOOP</text>
  </g>
</svg>
